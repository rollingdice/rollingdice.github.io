name: Deploy Astro site to Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== dist/ contents ==="
          find dist -type f | sort
          echo "=== dist/ size ==="
          du -sh dist/

      # Guard: if the router accidentally remaps all paths (e.g. a Vite
      # allowedHosts leak in astro.config.mjs), every /insights/* page should
      # still be present in the static build. Fail the workflow so a broken
      # deploy never reaches GitHub Pages.
      - name: Assert insight pages built
        run: |
          set -euo pipefail
          INSIGHTS=$(find dist/insights -name 'index.html' | wc -l)
          echo "Insight pages in build: $INSIGHTS"
          if [ "$INSIGHTS" -lt 10 ]; then
            echo "::error::Expected >=10 insight pages, found $INSIGHTS. Routing may be broken (check astro.config.mjs)."
            exit 1
          fi
          # Spot-check one known page actually resolves to a real file
          if [ ! -f dist/insights/why-your-next-hardware-wallet-should-have-a-keyboard/index.html ]; then
            echo "::error::Known insight page missing from build — routing leak suspected."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

    <script>// boot-trap.js — classic (non-module) script injected as the FIRST thing in <head>
// before the big ES-module bundle. Catches any error that happens during/after
// module load, including ones a React-level error trap misses (the React trap
// only attaches after React mounts). Paints diagnostics directly into #root.
(function () {
  function paint(t) {
    try {
      var host = document.getElementById('root') || document.body;
      var d = document.createElement('pre');
      d.style.cssText =
        'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;color:#f66;' +
        'background:rgba(0,0,0,.92);font:12px/1.5 monospace;padding:10px;' +
        'margin:0;white-space:pre-wrap;max-height:60%;overflow:auto;text-align:left';
      d.textContent = t;
      host.appendChild(d);
    } catch (e) {}
  }
  window.__boot = { t: Date.now(), marks: [] };
  window.__bootmark = function (m) {
    window.__boot.marks.push(m + ' @' + (Math.round((Date.now() - window.__boot.t) / 100) / 10) + 's');
    console.log('[boot]', m);
    try {
      var b = document.getElementById('__bootbadge');
      if (b) {
        b.textContent = 'BOOT: ' + window.__boot.marks.join('  |  ');
        b.style.display = 'block';
      }
    } catch (e) {}
  };
  window.__bootmark('inline-script-ran');
  try {
    // Persistent, always-visible status badge so we can see how far loading gets
    // even when there's no error (e.g. a hanging network await before first paint).
    var badge = document.createElement('div');
    badge.id = '__bootbadge';
    badge.style.cssText =
      'position:fixed;top:0;left:0;z-index:2147483647;display:none;background:#111;color:#0f0;' +
      'font:11px monospace;padding:3px 6px;max-width:100%;overflow:hidden;white-space:nowrap';
    (document.body || document.documentElement).appendChild(badge);

    // Every 2s, if boot never completed, dump the real DOM state into window.__bwdom
    // so a screenshot shows whether navigation content EXISTS (but is invisible) or
    // React rendered nothing at all.
    window.__bwdom = function () {
      try {
        var root = document.getElementById('root');
        var txt = (root && root.innerText ? root.innerText.replace(/\s+/g, ' ').slice(0, 120) : '');
        var txtLen = txt ? txt.length : 0;
        var kids = root ? root.querySelectorAll('*').length : -1;
        return ('kids=' + kids + ' text(' + txtLen + ')=[' + txt + ']').slice(0, 400);
      } catch (e) {
        return 'dom-dump-err ' + e;
      }
    };
    var iv = setInterval(function () {
      if (window.__bootdone) { clearInterval(iv); return; }
      window.__bootmark('dom@' + window.__bwdom());
    }, 4000);
    setTimeout(function () { window.__bootdone = true; }, 40000);
  } catch (e) {}
  window.addEventListener('error', function (e) {
    var m = (e && e.message) || 'unknown error';
    var loc = e && e.filename ? '  @ ' + ((e.filename.split('/').pop() || '') + ':' + e.lineno + ':' + e.colno) : '';
    window.__bootmark('window.onerror: ' + m + loc);
    paint('BOOT TRAP ERROR:\n' + m + loc + '\n\nmarks: ' + window.__boot.marks.join(' | '));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    var m = r instanceof Error ? r.message : String(r);
    window.__bootmark('unhandledrejection: ' + m);
    paint('BOOT TRAP REJECTION:\n' + m + '\n\nmarks: ' + window.__boot.marks.join(' | '));
  });
  window.addEventListener('DOMContentLoaded', function () {
    window.__bootmark('DOMContentLoaded');
  });
})();
</script>
